name: ci

# Restored after the pnpm workspace scaffold moved the original pipeline and the
# Python platform into .migration-backup/. The Python jobs run from there until
# that tree is promoted back to the root; the workspace job covers the TypeScript side.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  AGENTIC_APP_ENV: test
  AGENTIC_JWT_SECRET: ci-only-signing-key-not-for-production-0001
  AGENTIC_DATABASE_URL: postgresql+psycopg://agentic_app:agentic_app@localhost:5432/agentic
  AGENTIC_DATABASE_OWNER_URL: postgresql+psycopg://agentic_owner:agentic_owner@localhost:5432/agentic
  AGENTIC_REDIS_URL: redis://127.0.0.1:6379/15

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace typecheck (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  python-static:
    name: Python format, lint and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .migration-backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .migration-backup/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy packages/agentic_os/src/agentic_os

  python-tests:
    name: Python unit, integration, database and tenant-isolation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .migration-backup
    env:
      AGENTIC_REQUIRE_SERVICES: db,redis
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .migration-backup/pyproject.toml
      - run: pip install -e ".[dev,parsers]"
      - name: Bootstrap cluster roles and extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -f database/bootstrap/00_cluster_bootstrap.sql
          psql -h localhost -U postgres -c "CREATE DATABASE agentic OWNER agentic_owner"
          psql -h localhost -U postgres -d agentic -f database/bootstrap/01_extensions.sql
      - run: agentic-migrate up
      - run: agentic-seed
      - run: pytest tests/agents tests/unit tests/integration tests/database tests/tenant_isolation tests/workflows tests/api tests/observability tests/rag tests/security tests/redteam tests/i18n -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
