name: assurance-pipeline

on:
  pull_request:
  push:
    branches: [main, "build/**", "claude/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  AGENTIC_APP_ENV: test
  AGENTIC_JWT_SECRET: ci-only-signing-key-not-for-production-0001
  AGENTIC_DATABASE_URL: postgresql+psycopg://agentic_app:agentic_app@localhost:5432/agentic
  AGENTIC_DATABASE_OWNER_URL: postgresql+psycopg://agentic_owner:agentic_owner@localhost:5432/agentic
  AGENTIC_REDIS_URL: redis://127.0.0.1:6379/15

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- static
  format-lint-types:
    name: Format, lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy packages/agentic_os/src/agentic_os
        continue-on-error: true   # advisory until the annotation debt is cleared

  # ------------------------------------------------------------ contracts
  contract-validation:
    name: Agent-contract and registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate registries
        run: |
          python - <<'PY'
          import sys
          from agentic_os.core.registry import validate_registries
          problems = validate_registries()
          print("\n".join(problems) if problems else "registries valid")
          sys.exit(1 if problems else 0)
          PY
      - name: Agent contract tests
        run: pytest tests/agents -q

  # ----------------------------------------------------------------- tests
  tests:
    name: Unit, integration, database and tenant-isolation tests
    runs-on: ubuntu-latest
    # This job provisions PostgreSQL and Redis, so their absence is a defect,
    # not a developer's local circumstance. Without this, a service that died
    # mid-job would skip every test that depends on it and the job would still
    # report green — "0 failed" is all the exit code says. "dr" is deliberately
    # absent: no maintenance identity exists here, so DRP-001 stays
    # NOT_EVIDENCED rather than being forced to pass.
    env:
      AGENTIC_REQUIRE_SERVICES: db,redis
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      # The shared rate limiter is tested against a real Redis. Without this
      # service those tests skip, and a skipped test evidences nothing.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,parsers]"

      - name: Bootstrap cluster roles and extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -f database/bootstrap/00_cluster_bootstrap.sql
          psql -h localhost -U postgres -c "CREATE DATABASE agentic OWNER agentic_owner"
          psql -h localhost -U postgres -d agentic -f database/bootstrap/01_extensions.sql

      - name: Apply migrations
        run: agentic-migrate up

      - name: Seed
        run: agentic-seed

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests
        run: pytest tests/integration -q

      - name: Database and migration tests
        run: pytest tests/database -q

      - name: Tenant-isolation tests
        run: pytest tests/tenant_isolation -q

      - name: Workflow tests
        run: pytest tests/workflows -q

      - name: API tests
        run: pytest tests/api -q

      - name: RAG evaluation and leakage tests
        run: pytest tests/rag -q

      - name: Security control tests
        run: pytest tests/security -q

      - name: Agentic red-team tests
        run: pytest tests/redteam -q

      # Measure the governed path under concurrency, then hold the measurement
      # to account. A load test that never runs would leave the SLO declared
      # rather than measured, which is the state this replaced.
      - name: Load test
        run: |
          AGENTIC_RATE_LIMIT_PER_MINUTE=100000 \
            uvicorn agentic_os.api.app:app --host 127.0.0.1 --port 8000 --log-level warning &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          python scripts/loadtest.py --requests 120 --concurrency 1,8,32

      - name: Full suite with JUnit report
        env:
          AGENTIC_REQUIRE_PERF_REPORT: "1"
        run: pytest tests -q --junitxml=artifacts/junit.xml

      # Best-effort: a full artifact store must not turn a green test run red.
      # The pytest exit status above is what gates this job.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: junit-report
          path: artifacts/junit.xml
          retention-days: 14

  # --------------------------------------------------------------- security
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the pull request's commits to scope the scan; the
    # workflow-level `contents: read` alone makes that call 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scan result is the gate. Uploading the report as an artifact is
          # delivery, and when the account's artifact storage is full that
          # upload throws *after* a clean scan — reporting a secret-scan
          # failure that did not happen. Findings are in the step log either
          # way, and the action still exits non-zero when it finds one.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install bandit[toml] semgrep
      - name: bandit
        run: bandit -c pyproject.toml -r packages/agentic_os/src/agentic_os -ll -f txt
      - name: semgrep
        run: semgrep --config auto --error --severity ERROR .
        continue-on-error: true

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pip-audit
      - run: pip install -e "."
      - name: pip-audit
        run: pip-audit --strict --ignore-vuln GHSA-none-placeholder
        continue-on-error: true

  container-scan:
    name: Container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile --target api -t agentic-os-api:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agentic-os-api:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  iac-scan:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure
          soft_fail: true

  deployment-manifests:
    name: Deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # These are the checks the build environment could not run: it had no
      # container registry access, no cluster and no Terraform binary.
      - name: Compose file is valid
        run: docker compose config -q
      - name: Kustomize overlays render
        run: |
          for overlay in infrastructure/kubernetes/overlays/*; do
            echo "== $overlay"
            kubectl kustomize "$overlay" > /dev/null
          done
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Terraform format and validate
        run: |
          terraform fmt -check -recursive infrastructure/terraform
          for env in infrastructure/terraform/environments/*; do
            echo "== $env"
            terraform -chdir="$env" init -backend=false -input=false
            terraform -chdir="$env" validate
          done

  # ------------------------------------------------------------------ SBOM
  sbom-aibom:
    name: SBOM and AIBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e "." cyclonedx-bom
      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/sbom.json --output-format JSON
      - name: Generate AIBOM
        run: python scripts/generate_aibom.py --output artifacts/aibom.json
      # Best-effort for the same reason: the bill of materials is generated by
      # the step above, and its generation is what this job verifies.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bill-of-materials
          path: artifacts/
          retention-days: 14

  # -------------------------------------------------------------- evidence
  evidence:
    name: Evidence bundle and release gate
    runs-on: ubuntu-latest
    needs: [format-lint-types, contract-validation, tests, sast, sbom-aibom]
    # This job must run in the *fullest* environment CI can provide, because
    # the number it computes is the platform's published maturity. It used to
    # run with only a database, so the accessibility and performance controls
    # had no report to read and scored NOT_EVIDENCED — the pipeline computed
    # 89.19 while the documents claimed 94.59, a number only a developer's
    # machine could reproduce. A score that depends on whose machine ran it is
    # not evidence.
    env:
      AGENTIC_REQUIRE_SERVICES: db,redis
      AGENTIC_REQUIRE_A11Y_REPORT: "1"
      AGENTIC_REQUIRE_PERF_REPORT: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,parsers]"
      - name: Prepare database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -f database/bootstrap/00_cluster_bootstrap.sql
          psql -h localhost -U postgres -c "CREATE DATABASE agentic OWNER agentic_owner"
          psql -h localhost -U postgres -d agentic -f database/bootstrap/01_extensions.sql
          agentic-migrate up
          agentic-seed

      - name: Build the console
        working-directory: apps/web
        run: |
          npm ci || npm install
          npm run build

      - name: Start the API and the console
        working-directory: apps/web
        run: |
          AGENTIC_RATE_LIMIT_PER_MINUTE=100000 \
            uvicorn agentic_os.api.app:app --host 127.0.0.1 --port 8000 --log-level warning &
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/public
          AGENTIC_API_BASE_URL=http://127.0.0.1:8000 PORT=3000 \
            node .next/standalone/server.js &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -o /dev/null -w "console: %{http_code}\n" http://127.0.0.1:3000/login

      - name: Accessibility audit (axe-core, WCAG 2.2 AA)
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          node tests/accessibility/axe_audit.mjs \
            --base http://127.0.0.1:3000 --out ../../artifacts/accessibility.json

      - name: Load test
        run: python scripts/loadtest.py --requests 120 --concurrency 1,8,32

      # Both reports now exist, and AGENTIC_REQUIRE_*_REPORT above turns a
      # silently missing one into a failure rather than a skip that would
      # quietly cost those controls their evidence.
      - name: Collect evidence and compute maturity
        run: agentic-evidence collect --environment ci --output artifacts

      # The floor sits just under the current score, not at an arbitrary 70. A
      # gate with 20 points of slack cannot notice evidence quietly going
      # missing — which is exactly what it failed to notice when this job ran
      # without the reports it needed. Raise the floor when the score rises.
      - name: Release gate
        run: agentic-evidence gate --min-score 90 --require-no-critical-blockers

      # Best-effort: the gate above is what decides this job.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: evidence-bundle
          path: artifacts/
          retention-days: 14

  # ------------------------------------------------------- frontend and a11y
  web:
    name: Web build and accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: apps/web
        run: npm ci || npm install
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: npm run build

      # The audit drives the real application against a real database, because
      # an accessibility result from a mocked page evidences nothing.
      - run: pip install -e ".[dev,parsers]"
      - name: Prepare database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -f database/bootstrap/00_cluster_bootstrap.sql
          psql -h localhost -U postgres -c "CREATE DATABASE agentic OWNER agentic_owner"
          psql -h localhost -U postgres -d agentic -f database/bootstrap/01_extensions.sql
          agentic-migrate up
          agentic-seed
      - name: Start the API and the console
        working-directory: apps/web
        run: |
          uvicorn agentic_os.api.app:app --host 127.0.0.1 --port 8000 --log-level warning &
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/public
          AGENTIC_API_BASE_URL=http://127.0.0.1:8000 PORT=3000 \
            node .next/standalone/server.js &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -o /dev/null -w "console: %{http_code}\n" http://127.0.0.1:3000/login
      - name: Accessibility audit (axe-core, WCAG 2.2 AA)
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          node tests/accessibility/axe_audit.mjs \
            --base http://127.0.0.1:3000 --out ../../artifacts/accessibility.json
      - name: Assert no serious or critical violations
        # Without this the suite would skip a missing report and the job would
        # go green having audited nothing.
        env:
          AGENTIC_REQUIRE_A11Y_REPORT: "1"
        run: pytest tests/accessibility -q
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: accessibility-report
          path: artifacts/accessibility.json
          retention-days: 14
