name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to certify and deploy
        required: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-sign:
    name: Build and sign
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ inputs.release_tag }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/api@${{ steps.build.outputs.digest }}

  deploy-staging:
    name: Deploy to staging
    needs: build-and-sign
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Apply manifests
        run: |
          echo "kubectl apply -k infrastructure/kubernetes/overlays/staging"
          echo "Deployment requires a configured cluster context."

  validate-staging:
    name: Post-deployment verification
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke checks
        run: |
          echo "curl -fsS \"$STAGING_URL/ready\""
          echo "agentic-evidence collect --environment staging"

  approve-production:
    name: Human approval
    needs: validate-staging
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - run: echo "Awaiting a named human approver for production promotion."

  canary:
    name: Canary
    needs: approve-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Promote 10 percent of traffic, hold, then verify SLOs."

  production:
    name: Production
    needs: canary
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Complete rollout after canary verification."

  post-deployment-evidence:
    name: Post-deployment evidence update
    needs: production
    runs-on: ubuntu-latest
    steps:
      - run: echo "agentic-evidence collect --environment production --certify ${{ inputs.release_tag }}"
