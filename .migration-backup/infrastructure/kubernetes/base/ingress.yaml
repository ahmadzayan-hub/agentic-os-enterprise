apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-os
  namespace: agentic-os
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    # The application sets the same headers itself; the ingress repeats them so
    # a misconfigured upstream cannot silently drop them.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [agentic.internal.example]
      secretName: agentic-tls
  rules:
    - host: agentic.internal.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: agentic-api, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: agentic-web, port: { number: 3000 } } }
