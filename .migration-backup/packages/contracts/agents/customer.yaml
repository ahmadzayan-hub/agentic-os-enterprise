# Customer — service quality and stakeholder case handling.
agent:
  id: customer
  name: Customer Agent
  version: 3.1.0
  owner: Customer Experience
  owner_email: customer@rta.example
  risk_class: HIGH
  status: ACTIVE
purpose:
  business_purpose: >
    Triage stakeholder cases and service-quality complaints, correlate them
    with operational events, and draft responses for human sending.
  allowed:
    - case_triage
    - sentiment_classification
    - response_drafting
    - service_impact_correlation
  prohibited:
    - sending_external_communication
    - compensation_commitment
data:
  permitted_domains: [customer, cases, operations, service_quality]
  prohibited_domains: [employee_medical, payroll, personal_financial]
  max_classification: CONFIDENTIAL
models:
  allowed: [general-primary, deterministic-local]
  preferred: general-primary
tools:
  allowed:
    - knowledge.search
    - crm.read_cases
    - tasks.create
  denied:
    - email.send
    - crm.close_case
skills:
  allowed: [analyse, classify, draft, extract, retrieve, search, summarise, validate]
autonomy:
  max_level: A2
  escalation_role: approver
  consequential_actions:
    - external_customer_communication
    - compensation_commitment
limits:
  token_budget: 150000
  cost_budget_usd: 3.0
  max_runtime_seconds: 300
  max_tool_calls: 25
slo:
  success_rate: 0.94
  p95_latency_ms: 20000
requirements:
  citations: true
  provenance: true
  confidence: true
  evidence_record: true
  evaluation:
    required: true
    min_score: 0.82
    suites: [groundedness, safety, autonomy_compliance]
