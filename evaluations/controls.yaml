# Assurance control catalogue.
#
# This file is the *only* source of maturity. A control's status is derived
# from whether its named automated tests actually passed in the run being
# assessed — it can never be asserted by hand. A control with no `test:` is
# reported as NOT_EVIDENCED and contributes zero, however well implemented it
# may be.
#
# Weights total 136 across twenty domains, matching
# docs/governance/MATURITY_MODEL.md. The total is deliberately not normalised to
# 100: the score is verified weight over total applicable weight, so a control
# the platform cannot yet satisfy has to be *in* the catalogue to be counted
# against it. Two of the eighteen domains — deployment and independent
# assurance — exist for exactly that reason. Removing them would raise the
# score without changing anything about the platform, which is the failure mode
# this file is meant to prevent.
#
# critical: true means a failure blocks certification regardless of the score.

version: 1.1.0
total_weight: 136

domains:
  decision_intelligence: 23
  business_architecture: 7
  ux_accessibility: 9
  enterprise_architecture: 8
  agent_architecture: 10
  workflow_orchestration: 8
  data_architecture: 7
  rag_knowledge: 7
  security: 10
  ai_governance: 7
  privacy: 5
  reliability: 6
  observability: 5
  evaluation_assurance: 6
  devsecops: 4
  dr_resilience: 2
  business_value: 2
  deployment: 4
  independent_assurance: 3
  performance: 3

controls:
  # ------------------------------------------------ business architecture (7)
  # --------------------------------------------------------- decision intelligence
  #
  # The product's own promise, expressed as controls. DEC-002 and DEC-005 are
  # critical: a decision whose state can be moved illegally, or a confidence
  # figure with nothing behind it, are the two failures that would make every
  # other number on this platform untrustworthy.

  - id: DEC-001
    domain: decision_intelligence
    title: A decision case exists as a first-class governed record
    requirement: >-
      The organisation's decisions are recorded with their domain, owner,
      evidence and history — not inferred from agent runs.
    implementation: database/migrations/0013_decision_intelligence.sql
    weight: 2
    standards: [{framework: "ISO/IEC 42001", clause: "9.1 monitoring"}]
    test: tests/decisions/test_schema_guarantees.py::test_every_new_table_forces_row_level_security
    expected: Every decision table enforces FORCE ROW LEVEL SECURITY.

  - id: DEC-002
    domain: decision_intelligence
    title: Decision state transitions are enforced server-side
    requirement: >-
      A decision may move only along the lifecycle's declared edges, and only
      by a principal holding the permission the destination requires.
    implementation: agentic_os.decisions.lifecycle.transition — the sole writer of the column.
    weight: 3
    critical: true
    standards: [{framework: "ISO/IEC 42001", clause: "8.1 operational control"}]
    test: tests/decisions/test_lifecycle.py::test_every_ordered_pair_of_states_is_legal_or_illegal_as_declared
    expected: All 121 ordered pairs of states behave as the transition table declares.

  - id: DEC-003
    domain: decision_intelligence
    title: The lifecycle has exactly one writer
    requirement: The decision state column is written in one place and nowhere else.
    implementation: A source scan over the package, run as a test.
    weight: 2
    test: tests/decisions/test_lifecycle.py::test_nothing_outside_the_lifecycle_module_writes_the_state_column
    expected: No module other than the lifecycle engine issues UPDATE decisions.

  - id: DEC-004
    domain: decision_intelligence
    title: A decision's history cannot be rewritten
    requirement: >-
      The transition log is append-only for every role including the one that
      provisions tenants, and survives TRUNCATE.
    implementation: Triggers on decision_transitions modelled on the audit ledger's.
    weight: 2
    standards: [{framework: "ISO 27001", clause: "A.8.15 logging"}]
    test: tests/decisions/test_schema_guarantees.py::test_the_transition_log_refuses_update_even_for_the_provisioning_role
    expected: UPDATE, DELETE and TRUNCATE on the transition log are all refused.

  - id: DEC-005
    domain: decision_intelligence
    title: AI confidence is calculated or absent, never invented
    requirement: >-
      A confidence figure is derived from stored, countable inputs. Where the
      inputs do not support one, the platform reports "Not Calculated" rather
      than substituting a number.
    implementation: >-
      agentic_os.decisions.confidence, plus a CHECK constraint that refuses a
      non-null confidence whose calculation carries no inputs.
    weight: 3
    critical: true
    standards: [{framework: "ISO/IEC 42001", clause: "6.1.2 AI risk assessment"}]
    test: tests/decisions/test_schema_guarantees.py::test_a_confidence_with_the_default_empty_calculation_is_refused
    expected: The database refuses to store a confidence unaccompanied by its inputs.

  - id: DEC-006
    domain: decision_intelligence
    title: Cross-domain decision access is zero
    requirement: >-
      A principal outside a decision's domain retrieves nothing and is told the
      decision does not exist, rather than being told it is forbidden.
    implementation: Domain membership is a join inside the query, not a filter after it.
    weight: 3
    critical: true
    standards: [{framework: "ISO 27001", clause: "A.5.15 access control"}]
    test: tests/decisions/test_domain_isolation.py::test_the_database_returns_nothing_rather_than_filtering_afterwards
    expected: The scoped query returns zero rows for a non-member.

  - id: DEC-007
    domain: decision_intelligence
    title: Review and approval are separate stations
    requirement: >-
      A role that reviews a recommendation may not also approve it, and the
      platform administrator holds no authority over business decisions.
    implementation: BUSINESS_DECISION_AUTHORITY excluded from the blanket admin grant.
    weight: 2
    standards: [{framework: "ISO 27001", clause: "A.5.3 segregation of duties"}]
    test: tests/decisions/test_lifecycle.py::test_a_section_lead_can_review_but_cannot_approve
    expected: A section lead reviewing a case is refused when they try to approve it.

  - id: DEC-008
    domain: decision_intelligence
    title: An agent cannot carry a decision past a human station
    requirement: >-
      An agent may advance analysis and may never review, approve, execute or
      verify on its own.
    implementation: The lifecycle engine refuses those destinations without a human principal.
    weight: 2
    standards: [{framework: "ISO/IEC 42001", clause: "8.4 human oversight"}]
    test: tests/decisions/test_lifecycle.py::test_an_agent_cannot_approve_or_verify_on_its_own
    expected: An agent context is refused at AWAITING_APPROVAL and beyond.

  - id: DEC-009
    domain: decision_intelligence
    title: The North Star rate is honest over an empty set
    requirement: >-
      Decision Effectiveness Rate is null where nothing has reached
      verification — not 0% and not 100%.
    implementation: agentic_os.decisions.effectiveness.
    weight: 2
    test: tests/decisions/test_confidence_and_effectiveness.py::test_the_rate_is_not_calculated_over_an_empty_set
    expected: The rate is None and displays as "Not Calculated".

  - id: DEC-010
    domain: decision_intelligence
    title: Every KPI carries its own definition
    requirement: A displayed KPI has a formula, a unit, a direction and a target.
    implementation: kpi_definitions, with kpi_values unable to exist without one.
    weight: 2
    test: tests/decisions/test_decision_api.py::test_every_kpi_carries_its_definition
    expected: Every KPI returned by the API states how it is computed.

  - id: BUS-001
    domain: business_architecture
    title: Governed domain agent catalogue exists
    requirement: The platform defines a bounded set of governed domain agents with owners.
    implementation: packages/contracts/agents/*.yaml, validated against a JSON Schema.
    weight: 2
    standards: [{framework: "ISO/IEC 42001", clause: "6.1 planning"}]
    test: tests/agents/test_contract_validation.py::test_all_declared_domain_agents_exist
    expected: All ten declared domain agents have a valid published contract.

  - id: BUS-002
    domain: business_architecture
    title: Every agent declares a business purpose and owner
    requirement: An agent without a named owner and stated purpose may not run.
    implementation: Agent contract schema requires owner and business_purpose.
    weight: 2
    test: tests/agents/test_contract_validation.py::test_registries_are_internally_consistent
    expected: Contract schema validation passes for every agent.

  - id: BUS-003
    domain: business_architecture
    title: Business outcomes are recorded with an auditable basis
    requirement: ROI is computed only from measured outcomes carrying evidence.
    implementation: business_outcomes table with a MEASURED-requires-evidence constraint.
    weight: 3
    test: tests/integration/test_business_outcomes.py::test_measured_outcome_requires_evidence
    expected: A MEASURED outcome without evidence references is rejected by the database.

  # -------------------------------------------------- UX and accessibility (7)
  - id: UX-001
    domain: ux_accessibility
    title: Operational UI is served and reachable
    requirement: The operator experience exists and renders the governed surfaces.
    implementation: apps/web Next.js application.
    weight: 2
    test: tests/api/test_api_surface.py::test_openapi_document_is_served
    expected: The API the UI consumes is documented and reachable.

  - id: UX-002
    domain: ux_accessibility
    title: Run detail exposes the full execution record
    requirement: A human can see plan, steps, policy, risk, cost and citations for a run.
    implementation: /api/v1/runs/{id} returns the complete governed record.
    weight: 3
    test: tests/api/test_api_surface.py::test_run_detail_exposes_governance_record
    expected: Run detail includes plan, steps, policy decisions, risk and citations.

  - id: UX-003
    domain: ux_accessibility
    title: WCAG 2.2 AA conformance is verified
    requirement: The operator UI meets WCAG 2.2 AA.
    implementation: >
      axe-core driven through Playwright against the running application, covering
      WCAG 2.0/2.1/2.2 A and AA plus best-practice rules, in both colour schemes.
    weight: 2
    test: tests/accessibility/test_wcag_conformance.py::test_no_serious_or_critical_accessibility_violations
    expected: >
      axe-core reports zero serious or critical violations across every primary
      surface in both light and dark colour schemes and both writing directions.

  - id: UX-004
    domain: ux_accessibility
    title: The interface renders correctly right-to-left
    requirement: >-
      The console must lay out correctly in a right-to-left language. Direction
      follows the reader's locale and no rule may pin itself to a physical side
      of the screen.
    implementation: >-
      Locale drives <html lang> and <html dir>; the stylesheet uses logical
      properties only. tests/i18n/test_bidirectional_layout.py fails on any
      physical direction property, and the axe audit runs the full surface set
      in Arabic as well as English.
    weight: 2
    test: tests/i18n/test_bidirectional_layout.py::test_no_stylesheet_rule_pins_itself_to_a_physical_side
    expected: No stylesheet rule uses a physical side; the document sets direction from the locale.

  # ----------------------------------------------- enterprise architecture (8)
  - id: EA-001
    domain: enterprise_architecture
    title: Registries are mutually consistent
    requirement: No contract may reference an unregistered tool, skill or model.
    implementation: agentic_os.core.registry.validate_registries, run in CI.
    weight: 3
    critical: true
    test: tests/agents/test_contract_validation.py::test_registries_are_internally_consistent
    expected: Cross-registry validation returns no problems.

  - id: EA-002
    domain: enterprise_architecture
    title: The Conductor holds no tool authority
    requirement: Architecture Constitution rule 17.
    implementation: Empty tool grant, zero tool budget, enforced by validator and gateway.
    weight: 3
    critical: true
    test: tests/agents/test_contract_validation.py::test_conductor_holds_no_tool_authority
    expected: The Conductor contract grants no tools and permits zero tool calls.

  - id: EA-003
    domain: enterprise_architecture
    title: Declared-but-unbuilt capabilities are explicit
    requirement: A capability is either implemented or clearly marked NOT_IMPLEMENTED.
    implementation: tools.implementation_status, enforced at the gateway.
    weight: 2
    test: tests/security/test_tool_gateway.py::test_unimplemented_tool_is_refused_not_faked
    expected: An unimplemented tool returns 501 and never fabricates a result.

  # ---------------------------------------------------- agent architecture (10)
  - id: AGT-001
    domain: agent_architecture
    title: Agent contracts bound tools, skills, models and data domains
    requirement: An agent may only use capabilities its contract grants.
    implementation: Authorization engine agent-contract stage plus gateway enforcement.
    weight: 3
    critical: true
    test: tests/security/test_tool_gateway.py::test_tool_outside_the_agent_contract_is_denied
    expected: A tool outside the contract is denied at the AUTHORIZATION stage.

  - id: AGT-002
    domain: agent_architecture
    title: Autonomy ceilings are enforced
    requirement: No agent may act above its declared autonomy level.
    implementation: Authorization engine autonomy stage with a min() ceiling.
    weight: 3
    critical: true
    test: tests/redteam/test_agentic_red_team.py::test_agent_cannot_exceed_its_autonomy_ceiling
    expected: An A3 action by an A1 agent is denied at the AUTONOMY stage.

  - id: AGT-003
    domain: agent_architecture
    title: No contract grants autonomous A4
    requirement: Consequential actions always route through human approval.
    implementation: Contract validation asserts max_level != A4.
    weight: 2
    critical: true
    test: tests/redteam/test_agentic_red_team.py::test_no_contract_grants_autonomous_a4
    expected: Every agent contract declares a ceiling below A4.

  - id: AGT-004
    domain: agent_architecture
    title: Agent execution budgets are enforced
    requirement: Token, cost, runtime and tool-call limits stop execution.
    implementation: AgentBudget checked before every skill and tool call.
    weight: 2
    test: tests/redteam/test_agentic_red_team.py::test_agent_budget_stops_at_the_limit
    expected: Exceeding any declared limit raises BudgetExceeded.

  # ------------------------------------------------ workflow orchestration (8)
  - id: WKF-001
    domain: workflow_orchestration
    title: Workflow state is durable and resumable
    requirement: A workflow survives worker restart and resumes from its last step.
    implementation: Database-held state with leasing.
    weight: 2
    test: tests/workflows/test_workflow_engine.py::test_workflow_runs_to_completion
    expected: A multi-step workflow completes with every step recorded.

  - id: WKF-002
    domain: workflow_orchestration
    title: Steps are idempotent
    requirement: A completed step is never re-executed.
    implementation: Per-tenant unique idempotency key plus completed-step short circuit.
    weight: 2
    critical: true
    test: tests/workflows/test_workflow_engine.py::test_completed_step_is_never_re_executed
    expected: Re-advancing a run does not increment a completed step's attempt count.

  - id: WKF-003
    domain: workflow_orchestration
    title: Failures retry with backoff, then dead-letter
    requirement: Retries are bounded and exhausted failures are captured, not lost.
    implementation: Exponential backoff to max_attempts, then workflow_dead_letters.
    weight: 2
    test: tests/workflows/test_workflow_engine.py::test_retryable_failure_retries_then_dead_letters
    expected: Attempts stop at max_attempts and one dead-letter row is written.

  - id: WKF-004
    domain: workflow_orchestration
    title: Failed workflows compensate completed steps
    requirement: Partial work is undone in reverse order.
    implementation: Reverse-order compensation with per-step compensation actions.
    weight: 2
    test: tests/workflows/test_workflow_engine.py::test_failure_compensates_completed_steps_in_reverse
    expected: The run ends COMPENSATED and the compensating action executed.

  # -------------------------------------------------- data architecture (7)
  - id: DAT-001
    domain: data_architecture
    title: Every tenant table enforces row level security
    requirement: Isolation is enforced by the database, not by application code.
    implementation: Uniform RLS applied by catalogue introspection with FORCE.
    weight: 3
    critical: true
    test: tests/tenant_isolation/test_rls_isolation.py::test_every_tenant_table_has_forced_rls
    expected: No tenant-scoped table lacks FORCE ROW LEVEL SECURITY.

  - id: DAT-002
    domain: data_architecture
    title: Cross-tenant access fails closed
    requirement: A bound session sees only its own tenant; an unbound session sees nothing.
    implementation: RLS policies keyed on the transaction-local app.tenant_id GUC.
    weight: 3
    critical: true
    test: tests/tenant_isolation/test_rls_isolation.py::test_unbound_session_sees_nothing
    expected: An unbound session returns zero rows from every protected table.

  - id: DAT-003
    domain: data_architecture
    title: The application role cannot bypass isolation
    requirement: The runtime role holds neither BYPASSRLS nor superuser.
    implementation: Role attributes set in cluster bootstrap and asserted on every run.
    weight: 1
    critical: true
    test: tests/tenant_isolation/test_rls_isolation.py::test_application_role_cannot_bypass_rls
    expected: rolbypassrls and rolsuper are both false for the application role.

  # --------------------------------------------------- RAG and knowledge (7)
  - id: RAG-001
    domain: rag_knowledge
    title: Retrieval is ACL-filtered before ranking
    requirement: Unauthorised content is never fetched, scored or ranked.
    implementation: ACL predicate inside the retrieval SQL.
    weight: 3
    critical: true
    test: tests/rag/test_retrieval_governance.py::test_restricted_content_never_leaks_below_clearance
    expected: RESTRICTED content is invisible to every principal below RESTRICTED clearance.

  - id: RAG-002
    domain: rag_knowledge
    title: Document access denial does not disclose existence
    requirement: Denied and not-found are indistinguishable.
    implementation: fetch_document raises an identical error for both cases.
    weight: 2
    test: tests/rag/test_retrieval_governance.py::test_fetch_document_denies_unauthorised_and_hides_existence
    expected: Both paths produce the same error message.

  - id: RAG-003
    domain: rag_knowledge
    title: Citations resolve and unsupported claims are rejected
    requirement: Every cited claim must be supported by its cited source.
    implementation: verify_citations content-overlap check.
    weight: 2
    test: tests/rag/test_retrieval_governance.py::test_citation_verification_rejects_unsupported_claims
    expected: Unsupported and dangling citations are reported as unverified.

  # ------------------------------------------------------------- security (10)
  - id: SEC-001
    domain: security
    title: Every tool call passes the full gateway pipeline
    requirement: No tool executes without identity, authorization, policy, risk and audit.
    implementation: ToolGateway 14-stage pipeline.
    weight: 2
    critical: true
    test: tests/security/test_tool_gateway.py::test_unauthenticated_call_is_denied_at_identity
    expected: An unauthenticated call is denied at the IDENTITY stage.

  - id: SEC-002
    domain: security
    title: Untrusted content cannot become instruction
    requirement: Only system- and policy-trusted tiers may instruct.
    implementation: Context firewall trust tiers and envelopes.
    weight: 2
    critical: true
    test: tests/security/test_context_firewall.py::test_only_the_top_two_tiers_may_instruct
    expected: Exactly the two highest trust tiers are instruction-bearing.

  - id: SEC-003
    domain: security
    title: Prompt injection is detected and high-confidence content is blocked
    requirement: Injection attempts are detected, recorded and withheld.
    implementation: Pattern detection with confidence scoring and blocking.
    weight: 1
    test: tests/security/test_context_firewall.py::test_high_confidence_injection_is_blocked_not_rendered
    expected: A high-confidence injection is blocked rather than rendered.

  - id: SEC-004
    domain: security
    title: Secrets never reach logs, audit or model context
    requirement: Credential values are never persisted or exposed.
    implementation: Audit redaction, secret handles without values, gateway sanitisation.
    weight: 2
    critical: true
    test: tests/redteam/test_agentic_red_team.py::test_secrets_never_survive_audit_redaction
    expected: No secret pattern survives redaction.

  - id: SEC-005
    domain: security
    title: Authentication rejects forged and tampered tokens
    requirement: A token not signed by the platform never authenticates.
    implementation: JWT verification with issuer, audience and required claims.
    weight: 1
    critical: true
    test: tests/redteam/test_agentic_red_team.py::test_forged_token_claims_do_not_grant_access
    expected: A token signed with a foreign key is rejected.

  - id: SEC-006
    domain: security
    title: Code execution through the expression evaluator is impossible
    requirement: The calculation sandbox refuses imports, attribute access and builtins.
    implementation: AST allowlist evaluator with node and exponent limits.
    weight: 1
    critical: true
    test: tests/redteam/test_agentic_red_team.py::test_sandboxed_evaluator_refuses_code_execution
    expected: Every code-execution payload raises ValidationError.

  - id: SEC-007
    domain: security
    title: Kill switches halt agent activity
    requirement: A scoped kill switch stops execution immediately and is audited.
    implementation: Kill-switch checks at the model and tool gateways.
    weight: 1
    critical: true
    test: tests/security/test_tool_gateway.py::test_kill_switch_blocks_every_tool
    expected: An engaged tenant kill switch blocks every tool call.

  # -------------------------------------------------------- AI governance (7)
  - id: AIG-001
    domain: ai_governance
    title: Consequential actions require human approval
    requirement: Financial, destructive, external and irreversible actions are A4.
    implementation: Risk engine hard floors plus approval engine.
    weight: 2
    critical: true
    test: tests/redteam/test_agentic_red_team.py::test_financial_actions_are_always_critical_and_a4
    expected: A financial action is CRITICAL and requires A4 regardless of amount.

  - id: AIG-002
    domain: ai_governance
    title: Separation of duties on approvals
    requirement: One person cannot satisfy a dual approval alone.
    implementation: Approval engine rejects a repeat decision by the same principal.
    weight: 2
    critical: true
    test: tests/redteam/test_agentic_red_team.py::test_the_same_person_cannot_satisfy_a_dual_approval
    expected: The second decision by the same person is refused.

  - id: AIG-003
    domain: ai_governance
    title: An approval authorises one action only
    requirement: An approval cannot be replayed against a different action.
    implementation: Gateway matches the approval's recorded action.
    weight: 1
    critical: true
    test: tests/redteam/test_agentic_red_team.py::test_an_approval_for_one_action_does_not_authorise_another
    expected: An approval for one tool does not satisfy another.

  - id: AIG-004
    domain: ai_governance
    title: Models and prompts are versioned controlled assets
    requirement: A prompt body change without a version bump is rejected.
    implementation: Prompt registry hash verification on resolve.
    weight: 2
    test: tests/integration/test_prompt_registry.py::test_tampered_prompt_body_is_rejected
    expected: A prompt whose body no longer matches its hash fails to resolve.

  # ---------------------------------------------------------------- privacy (5)
  - id: PRV-001
    domain: privacy
    title: PII is detected and classification is raised accordingly
    requirement: A document containing sensitive identifiers is reclassified upward.
    implementation: DLP classification during ingestion.
    weight: 2
    test: tests/integration/test_ingestion_pipeline.py::test_pii_raises_document_classification
    expected: A document containing restricted identifiers becomes RESTRICTED.

  - id: PRV-002
    domain: privacy
    title: Redaction leaves no residual sensitive fragments
    requirement: Overlapping detections must not corrupt redaction.
    implementation: Overlap resolution before replacement.
    weight: 2
    test: tests/integration/test_ingestion_pipeline.py::test_redaction_leaves_no_residual_fragments
    expected: No fragment of any detected identifier survives redaction.

  - id: PRV-003
    domain: privacy
    title: Data subject request handling
    requirement: Access, export, deletion and rectification requests are processed.
    implementation: >-
      agentic_os.privacy.dsar processes ACCESS, EXPORT, DELETE and RECTIFY
      requests. Erasure detaches the subject from operational records,
      pseudonymises the account and deletes credential material; an active
      legal hold parks the request as BLOCKED_BY_HOLD instead of partially
      executing it, and the append-only audit ledger is never removed.
    weight: 1
    test: tests/integration/test_privacy_dsar.py::test_erasure_is_blocked_by_an_active_legal_hold
    expected: An erasure request under an active legal hold is blocked with the hold named, and no subject record is altered.

  # ------------------------------------------------------------ reliability (6)
  - id: REL-001
    domain: reliability
    title: Idempotent tool calls do not duplicate side effects
    requirement: A replayed call returns the prior result without re-executing.
    implementation: Per-tenant idempotency key on tool_calls.
    weight: 2
    critical: true
    test: tests/security/test_tool_gateway.py::test_repeated_call_with_the_same_key_does_not_re_execute
    expected: A replayed call creates no second row.

  - id: REL-002
    domain: reliability
    title: Work is leased exclusively
    requirement: Two workers never process the same run.
    implementation: FOR UPDATE SKIP LOCKED leasing.
    weight: 2
    test: tests/workflows/test_workflow_engine.py::test_claim_leases_runs_exclusively
    expected: A leased run is not claimable by a second worker.

  - id: REL-003
    domain: reliability
    title: Events are published transactionally
    requirement: An event and the state change it describes commit together.
    implementation: Transactional outbox.
    weight: 2
    test: tests/integration/test_event_bus.py::test_outbox_commits_with_the_state_change
    expected: A rolled-back state change leaves no outbox entry.

  # --------------------------------------------------------- observability (5)
  - id: OBS-001
    domain: observability
    title: Every governed action is audited
    requirement: Tool calls, model calls, approvals and policy decisions are recorded.
    implementation: Audit ledger writes on every gateway and engine path.
    weight: 2
    critical: true
    test: tests/security/test_tool_gateway.py::test_every_call_is_recorded_and_audited
    expected: A tool call produces both a tool_calls row and an audit entry.

  - id: OBS-002
    domain: observability
    title: The audit ledger is tamper-evident
    requirement: Ledger entries are hash-chained and immutable.
    implementation: Chained hashes plus append-only triggers.
    weight: 2
    critical: true
    test: tests/database/test_audit_ledger.py::test_ledger_rejects_mutation
    expected: UPDATE, DELETE and TRUNCATE are all rejected.

  - id: OBS-003
    domain: observability
    title: Run execution is traceable end to end
    requirement: A run exposes its full trace across planes.
    implementation: traces table plus run detail projection.
    weight: 1
    test: tests/api/test_api_surface.py::test_run_detail_exposes_governance_record
    expected: Run detail returns the complete execution record.

  # -------------------------------------------------- evaluation assurance (6)
  - id: EVL-001
    domain: evaluation_assurance
    title: Maturity is computed from executable evidence
    requirement: No maturity claim may be entered by hand.
    implementation: Evidence engine derives status from test results only.
    weight: 2
    critical: true
    test: tests/integration/test_evidence_engine.py::test_maturity_is_derived_only_from_test_results
    expected: A control with no passing test never reaches VERIFIED.

  - id: EVL-002
    domain: evaluation_assurance
    title: A failed critical control blocks certification
    requirement: Certification fails regardless of the numerical score.
    implementation: Critical blocker check in the maturity calculation.
    weight: 2
    critical: true
    test: tests/integration/test_evidence_engine.py::test_critical_failure_blocks_certification
    expected: Certification is refused when any critical control fails.

  - id: EVL-003
    domain: evaluation_assurance
    title: Evidence expires
    requirement: Stale evidence does not count toward maturity.
    implementation: Per-control evidence TTL.
    weight: 1
    test: tests/integration/test_evidence_engine.py::test_expired_evidence_does_not_count
    expected: Evidence past its TTL is reported EXPIRED and contributes zero.

  - id: EVL-004
    domain: evaluation_assurance
    title: A run that could not exercise its services fails rather than skips
    requirement: >-
      Evidence may not be produced by a run in which the tested service was
      absent. A skipped test must never be counted as a passing one.
    implementation: >-
      The requires_service gate in tests/conftest.py. AGENTIC_REQUIRE_SERVICES
      names the services whose absence is a failure; the CI test job sets it to
      the services it provisions, and
      tests/api/test_repository_hygiene.py::test_the_test_job_cannot_pass_by_skipping_its_services
      holds that wiring in place.
    weight: 1
    critical: true
    test: tests/test_service_gates.py::test_an_absent_service_fails_when_it_is_required
    expected: A required-but-absent service fails the run instead of skipping it.

  # ------------------------------------------------------------- devsecops (4)
  - id: DEV-001
    domain: devsecops
    title: Migrations are forward-only and checksum-verified
    requirement: An applied migration cannot be edited in place.
    implementation: schema_migrations checksum comparison.
    weight: 2
    test: tests/database/test_migrations.py::test_modified_migration_is_rejected
    expected: Editing an applied migration raises rather than re-running.

  - id: DEV-002
    domain: devsecops
    title: CI runs the full assurance pipeline
    requirement: Lint, types, tests, scans, SBOM and evidence run on every change.
    implementation: .github/workflows/ci.yml.
    weight: 2
    test: tests/api/test_repository_hygiene.py::test_ci_pipeline_covers_required_gates
    expected: The CI definition contains every required gate.

  # -------------------------------------------------- DR and resilience (2)
  - id: DRP-001
    domain: dr_resilience
    title: Backup and restore are verified by exercise
    requirement: A restore has been performed and verified.
    implementation: >-
      agentic_os.resilience.backup takes a real pg_dump, restores it into a
      scratch database, compares every table's row count against the source and
      recomputes each tenant's audit hash chain inside the restored copy before
      recording a restore_tests row with measured RPO and RTO. The scratch
      database is dropped afterwards. Without a maintenance identity the
      exercise refuses to run, leaving this control NOT_EVIDENCED.
    weight: 2
    test: tests/integration/test_disaster_recovery.py::test_a_restore_is_performed_and_verified_end_to_end
    expected: A restore_tests row with outcome SUCCESS, a measured RPO and RTO, matching row counts and an intact audit chain in the restored copy.

  # --------------------------------------------------------- performance (3)
  - id: PRF-001
    domain: performance
    title: The platform is measured under concurrency, not only under one request
    requirement: >-
      Latency and success rate are measured with requests overlapping, across
      more than one concurrency level, and the measurement records the
      conditions it was taken under.
    implementation: >-
      scripts/loadtest.py drives the running API across a concurrency sweep and
      writes artifacts/performance.json; tests/performance asserts the result.
      CI runs both, and a missing report fails rather than skips.
    weight: 1
    test: tests/performance/test_slo_conformance.py::test_every_request_succeeded_at_every_concurrency
    expected: Every request succeeds at every concurrency level — no pool exhaustion, no lost tenant binding, no lease race.

  - id: PRF-002
    domain: performance
    title: Uncontended latency is gated against regression
    requirement: A per-request cost regression fails the build.
    implementation: >-
      The concurrency-1 pass measures cost with no queueing; the suite fails if
      p95 exceeds the budget, which catches an unindexed query or an N+1
      without tripping on ordinary CI variance.
    weight: 1
    test: tests/performance/test_slo_conformance.py::test_uncontended_latency_has_not_regressed
    expected: p95 at concurrency 1 stays within the documented budget for every scenario.

  - id: PRF-003
    domain: performance
    title: Capacity is established on representative hardware
    requirement: >-
      Throughput and latency are measured on hardware and data volumes
      representative of production, with a stated headroom margin.
    implementation: >-
      NOT_IMPLEMENTED as evidence. The measurement that exists runs one API
      process against one database on a shared development host with a seeded
      corpus. It characterises the platform's saturation behaviour — throughput
      peaks near concurrency 8 and degrades beyond it — but it is not a capacity
      statement, and no production-representative run has been performed.
    weight: 1
    expected: A load test on production-representative hardware and data volume, with a stated headroom margin.

  # ---------------------------------------------------------- deployment (4)
  - id: DEP-001
    domain: deployment
    title: Deployment manifests run workloads unprivileged with no inline secrets
    requirement: >-
      Every deployed workload runs as a non-root user with privilege escalation
      disabled and all capabilities dropped, and no secret value is inlined in a
      manifest.
    implementation: infrastructure/kubernetes/base/*.yaml under restricted Pod Security.
    weight: 1
    test: tests/unit/test_deployables.py::test_kubernetes_workloads_run_unprivileged_and_carry_no_secrets
    expected: Every Deployment, Job and CronJob is unprivileged and sources values from a ConfigMap or Secret reference.

  - id: DEP-002
    domain: deployment
    title: The maintenance identity is confined to the recovery job
    requirement: >-
      The only identity able to create a database is mounted by the disaster
      recovery job and by nothing else.
    implementation: A separate agentic-maintenance-secrets Secret, referenced by one CronJob.
    weight: 1
    critical: true
    test: tests/unit/test_deployables.py::test_only_the_dr_cronjob_mounts_the_maintenance_identity
    expected: No workload other than agentic-dr-exercise references the maintenance secret.

  - id: DEP-003
    domain: deployment
    title: The platform has been deployed to a cluster and verified there
    requirement: >-
      The manifests have been applied to a real cluster and the deployed
      platform passed its readiness and smoke checks.
    implementation: >-
      NOT_IMPLEMENTED as evidence. The manifests, images and pipeline exist and
      the pipeline fails rather than reporting success when a cluster
      credential is absent, but no apply has been performed from this
      repository: the build environment had no cluster and no registry access.
    weight: 2
    expected: A recorded apply into at least one environment, followed by a passing readiness check against the deployed API.

  # ------------------------------------------------ independent assurance (3)
  - id: IND-001
    domain: independent_assurance
    title: An independent security assessment has been performed
    requirement: >-
      A party other than the builder has tested the platform and its findings
      have been triaged.
    implementation: >-
      NOT_IMPLEMENTED as evidence. The repository contains an automated
      red-team suite, but a suite written by the same author as the control it
      tests is not independent assurance and must not be reported as such.
    weight: 2
    expected: An assessment report from an independent party, with findings tracked to closure.

  - id: IND-002
    domain: independent_assurance
    title: At least one control is proven by production operation
    requirement: >-
      Evidence exists from the platform running in production, not only from a
      test environment.
    implementation: >-
      NOT_IMPLEMENTED as evidence. Every control that passes today is VERIFIED
      by an automated test in a development environment; none is
      PRODUCTION_PROVEN, and the evidence engine counts the two statuses
      separately for precisely this reason.
    weight: 1
    expected: At least one control recorded with status PRODUCTION_PROVEN from a production environment.

  # ------------------------------------------------------- business value (2)
  - id: BVL-001
    domain: business_value
    title: ROI derives only from auditable measured outcomes
    requirement: Estimated outcomes are excluded from ROI.
    implementation: Outcome engine separates MEASURED from ESTIMATED.
    weight: 2
    test: tests/integration/test_business_outcomes.py::test_roi_excludes_estimated_outcomes
    expected: Estimated outcomes are reported separately and excluded from ROI.
