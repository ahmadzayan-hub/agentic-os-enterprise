services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  control-plane:
    build: ../../services/control-plane
    ports: ["8000:8000"]
    depends_on: [postgres, redis]

  evidence-engine:
    build: ../../services/evidence-engine
    ports: ["8001:8001"]
    depends_on: [postgres]
