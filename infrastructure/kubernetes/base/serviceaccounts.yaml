# One identity per workload. The API and the worker have different reasons to
# exist and different blast radius, so they do not share a service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-api
  namespace: agentic-os
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-worker
  namespace: agentic-os
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-web
  namespace: agentic-os
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-maintenance
  namespace: agentic-os
automountServiceAccountToken: false
