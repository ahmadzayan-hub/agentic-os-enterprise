apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-web
  namespace: agentic-os
  labels: { app.kubernetes.io/name: agentic-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: agentic-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentic-web }
    spec:
      serviceAccountName: agentic-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/rta/agentic-os-web:3.1.0
          ports: [{ containerPort: 3000, name: http }]
          env:
            # Server components call the API in-cluster. The browser never
            # holds an API token: the session cookie is httpOnly and the web
            # tier exchanges it server-side.
            - { name: AGENTIC_API_BASE_URL, value: "http://agentic-api.agentic-os.svc.cluster.local:8000" }
            - { name: NODE_ENV, value: production }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: cache, mountPath: /app/.next/cache }
      volumes:
        - { name: cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-web
  namespace: agentic-os
spec:
  selector: { app.kubernetes.io/name: agentic-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
