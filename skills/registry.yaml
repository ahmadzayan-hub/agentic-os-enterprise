# Skill registry.
#
# A skill is a reusable, contract-bound capability. Skills are not independently
# privileged: they execute inside an agent's authority, never beside it.
#
# execution_mode:
#   DETERMINISTIC  runs in code; no model is called; output is reproducible
#   MODEL          runs through the model gateway
#   HYBRID         deterministic computation with model-generated narrative
#
# Deterministic execution is preferred wherever a correct answer can be
# computed (Architecture Constitution rule 16).

version: 1.0.0
skills:
  - key: analyse
    name: Analyse
    description: Decompose evidence into findings with explicit confidence.
    owner_team: Platform Engineering
    execution_mode: HYBRID
    risk_class: LOW
    required_tools: []
    evaluation_threshold: 0.80
    input_schema:
      type: object
      required: [subject, evidence]
      properties:
        subject: {type: string, minLength: 3}
        evidence: {type: array, items: {type: object}}
        question: {type: string}
    output_schema:
      type: object
      required: [findings, confidence]
      properties:
        findings:
          type: array
          items:
            type: object
            required: [statement, support]
            properties:
              statement: {type: string}
              support: {type: array, items: {type: string}}
        confidence: {type: number, minimum: 0, maximum: 1}

  - key: calculate
    name: Calculate
    description: Evaluate a numeric expression deterministically over named inputs.
    owner_team: Platform Engineering
    execution_mode: DETERMINISTIC
    risk_class: LOW
    required_tools: [calc.evaluate]
    evaluation_threshold: 1.0
    input_schema:
      type: object
      required: [expression, variables]
      properties:
        expression: {type: string, minLength: 1}
        variables: {type: object}
        precision: {type: integer, minimum: 0, maximum: 12}
    output_schema:
      type: object
      required: [value, expression]
      properties:
        value: {type: number}
        expression: {type: string}
        steps: {type: array, items: {type: string}}

  - key: classify
    name: Classify
    description: Assign an input to one of a fixed set of labels with a score.
    owner_team: Platform Engineering
    execution_mode: HYBRID
    risk_class: LOW
    required_tools: []
    evaluation_threshold: 0.85
    input_schema:
      type: object
      required: [text, labels]
      properties:
        text: {type: string, minLength: 1}
        labels: {type: array, items: {type: string}, minItems: 2}
    output_schema:
      type: object
      required: [label, score]
      properties:
        label: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
        rationale: {type: string}

  - key: compare
    name: Compare
    description: Compare options against weighted criteria and rank them.
    owner_team: Platform Engineering
    execution_mode: DETERMINISTIC
    risk_class: LOW
    required_tools: []
    evaluation_threshold: 1.0
    input_schema:
      type: object
      required: [options, criteria]
      properties:
        options: {type: array, items: {type: object}, minItems: 2}
        criteria:
          type: array
          items:
            type: object
            required: [key, weight]
            properties:
              key: {type: string}
              weight: {type: number}
              higher_is_better: {type: boolean}
    output_schema:
      type: object
      required: [ranking]
      properties:
        ranking:
          type: array
          items:
            type: object
            required: [option, score]
            properties:
              option: {type: string}
              score: {type: number}

  - key: draft
    name: Draft
    description: Produce a written draft for human review. Never sends anything.
    owner_team: Corporate Communications
    execution_mode: MODEL
    risk_class: MEDIUM
    required_tools: []
    evaluation_threshold: 0.80
    input_schema:
      type: object
      required: [document_type, context]
      properties:
        document_type: {type: string}
        context: {type: string, minLength: 10}
        audience: {type: string}
        tone: {type: string}
        max_words: {type: integer, minimum: 20, maximum: 4000}
    output_schema:
      type: object
      required: [draft, requires_human_send]
      properties:
        draft: {type: string}
        requires_human_send: {type: boolean, const: true}
        word_count: {type: integer}

  - key: extract
    name: Extract
    description: Pull structured fields out of unstructured text with provenance.
    owner_team: Information Management
    execution_mode: HYBRID
    risk_class: LOW
    required_tools: []
    evaluation_threshold: 0.85
    input_schema:
      type: object
      required: [text, fields]
      properties:
        text: {type: string, minLength: 1}
        fields: {type: array, items: {type: string}, minItems: 1}
    output_schema:
      type: object
      required: [values]
      properties:
        values: {type: object}
        missing: {type: array, items: {type: string}}
        spans: {type: object}

  - key: forecast
    name: Forecast
    description: Project a numeric series forward using a stated statistical method.
    owner_team: Business Intelligence
    execution_mode: DETERMINISTIC
    risk_class: MEDIUM
    required_tools: []
    evaluation_threshold: 0.90
    input_schema:
      type: object
      required: [series, periods]
      properties:
        series: {type: array, items: {type: number}, minItems: 3}
        periods: {type: integer, minimum: 1, maximum: 60}
        method: {enum: [linear, moving_average, holt_linear]}
    output_schema:
      type: object
      required: [forecast, method]
      properties:
        forecast: {type: array, items: {type: number}}
        method: {type: string}
        fit_quality: {type: number}

  - key: optimise
    name: Optimise
    description: Select the highest-value subset of items under a hard constraint.
    owner_team: Rail Maintenance Operations
    execution_mode: DETERMINISTIC
    risk_class: MEDIUM
    required_tools: []
    evaluation_threshold: 1.0
    input_schema:
      type: object
      required: [items, budget]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, value, cost]
            properties:
              key: {type: string}
              value: {type: number}
              cost: {type: number, minimum: 0}
        budget: {type: number, minimum: 0}
    output_schema:
      type: object
      required: [selected, total_value, total_cost]
      properties:
        selected: {type: array, items: {type: string}}
        total_value: {type: number}
        total_cost: {type: number}

  - key: reconcile
    name: Reconcile
    description: Match two record sets on a key and report differences.
    owner_team: Finance
    execution_mode: DETERMINISTIC
    risk_class: MEDIUM
    required_tools: []
    evaluation_threshold: 1.0
    input_schema:
      type: object
      required: [left, right, key]
      properties:
        left: {type: array, items: {type: object}}
        right: {type: array, items: {type: object}}
        key: {type: string}
        compare_fields: {type: array, items: {type: string}}
        tolerance: {type: number, minimum: 0}
    output_schema:
      type: object
      required: [matched, only_left, only_right, mismatched]
      properties:
        matched: {type: integer}
        only_left: {type: array, items: {type: string}}
        only_right: {type: array, items: {type: string}}
        mismatched: {type: array, items: {type: object}}

  - key: retrieve
    name: Retrieve
    description: Fetch a specific governed document the caller is authorised to read.
    owner_team: Information Management
    execution_mode: DETERMINISTIC
    risk_class: LOW
    required_tools: [knowledge.fetch_document]
    evaluation_threshold: 1.0
    input_schema:
      type: object
      required: [document_id]
      properties:
        document_id: {type: string}
    output_schema:
      type: object
      required: [document_id, title, content]
      properties:
        document_id: {type: string}
        title: {type: string}
        content: {type: string}
        classification: {type: string}

  - key: search
    name: Search
    description: ACL-aware hybrid search over the governed knowledge corpus.
    owner_team: Information Management
    execution_mode: DETERMINISTIC
    risk_class: LOW
    required_tools: [knowledge.search]
    evaluation_threshold: 0.85
    input_schema:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 2}
        top_k: {type: integer, minimum: 1, maximum: 50}
        filters: {type: object}
    output_schema:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [chunk_id, document_id, score]
            properties:
              chunk_id: {type: string}
              document_id: {type: string}
              score: {type: number}
              snippet: {type: string}

  - key: summarise
    name: Summarise
    description: Condense retrieved evidence, citing every claim.
    owner_team: Information Management
    execution_mode: MODEL
    risk_class: LOW
    required_tools: []
    evaluation_threshold: 0.82
    input_schema:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
        max_words: {type: integer, minimum: 20, maximum: 2000}
    output_schema:
      type: object
      required: [summary, citations]
      properties:
        summary: {type: string}
        citations: {type: array, items: {type: string}, minItems: 1}

  - key: transform
    name: Transform
    description: Map records between shapes using a declared field mapping.
    owner_team: Platform Engineering
    execution_mode: DETERMINISTIC
    risk_class: LOW
    required_tools: []
    evaluation_threshold: 1.0
    input_schema:
      type: object
      required: [records, mapping]
      properties:
        records: {type: array, items: {type: object}}
        mapping: {type: object}
        drop_unmapped: {type: boolean}
    output_schema:
      type: object
      required: [records, transformed_count]
      properties:
        records: {type: array, items: {type: object}}
        transformed_count: {type: integer}

  - key: validate
    name: Validate
    description: Check a payload against a JSON Schema and report every violation.
    owner_team: Platform Engineering
    execution_mode: DETERMINISTIC
    risk_class: LOW
    required_tools: []
    evaluation_threshold: 1.0
    input_schema:
      type: object
      required: [payload, schema]
      properties:
        payload: {}
        schema: {type: object}
    output_schema:
      type: object
      required: [valid, errors]
      properties:
        valid: {type: boolean}
        errors: {type: array, items: {type: object}}

  - key: verify
    name: Verify
    description: Confirm that every claim is supported by the cited source text.
    owner_team: Information Management
    execution_mode: DETERMINISTIC
    risk_class: MEDIUM
    required_tools: []
    evaluation_threshold: 0.90
    input_schema:
      type: object
      required: [claims, sources]
      properties:
        claims: {type: array, items: {type: object}}
        sources: {type: array, items: {type: object}}
        min_overlap: {type: number, minimum: 0, maximum: 1}
    output_schema:
      type: object
      required: [verified, unverified, coverage]
      properties:
        verified: {type: array, items: {type: object}}
        unverified: {type: array, items: {type: object}}
        coverage: {type: number, minimum: 0, maximum: 1}
